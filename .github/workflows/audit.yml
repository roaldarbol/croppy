name: Audit

# Security audit of the locked dependencies. Advisories land against pixi.lock
# independently of any code change, so this runs weekly against main (a failed
# scheduled run emails the maintainer), on demand, and on PRs that change the lock.
on:
  schedule:
    - cron: "0 6 * * 1"  # 06:00 UTC every Monday
  pull_request:
    paths:
      - pixi.lock
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          environments: dev docs
          locked: true

      # pip-audit runs from pipx rather than a pixi environment, because an
      # environment combining the others would make their tasks ambiguous.
      - name: Audit dependencies
        run: |
          paths=()
          for path in .pixi/envs/*/lib/python3.[0-9][0-9]/site-packages; do
            paths+=(--path "$path")
          done
          pipx run pip-audit "${paths[@]}"
